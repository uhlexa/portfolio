<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Meta</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>

  <h1>Website Stats!</h1>
  <div id="stats"></div>



  <div id="scrolly-1" class="scrollytelling">
    

    <div id="scatter-story">

    </div>


    <div id="scatter-plot">
      <h2>Commits by time of day</h2>
      <div id="chart">
        <dl id="commit-tooltip" class="info tooltip" hidden>
          <dt>Commit</dt>
          <dd><a href="" id="commit-link" target="_blank"></a></dd>

          <dt>Date</dt>
          <dd id="commit-date"></dd>

          <dt>Time</dt>
          <dd id="commit-time"></dd>

          <dt>Author</dt>
          <dd id="commit-author"></dd>

          <dt>Lines Edited</dt>
          <dd id="commit-lines"></dd>
        </dl>
      </div>

      <section id="selection-summary">
        <!-- <p id="selection-count">No commits selected</p> -->
        <dl id="language-breakdown" class="stats"></dl>
      </section>
    </div>

  </div>

  <dl id="files"></dl>


  <div id="commit-filter" style="display: flex; align-items: center;">
    <label for="commit-progress">Show commits until:</label>
    <input type="range" id="commit-progress" min="0" max="100" value="100" style="margin-left: 1em;" />
    <time id="commit-max-time" style="margin-left: auto;"></time>
  </div>
  <script type="module" src="./main.js"></script> 
  <script type="module" src="../global.js"></script>

</body>
</html>
